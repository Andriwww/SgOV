<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Modificar Asistente</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/asistentePersonal.css}">
</head>

<body>

<main class="container py-4">

    <h1 class="mb-4">Modificar Asistente</h1>

    <form th:action="@{/AsistentePersonal/update}"
          th:object="${asistente}"
          method="post">

        <!-- ID oculto -->
        <input type="hidden" th:field="*{idAsistente}" />

        <!-- resto igual que add -->

        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}"
                   class="form-control"
                   th:errorclass="needcorrection" />
            <div th:errors="*{nombre}" class="error"></div>
        </div>

        <div class="mb-3">
            <label>Apellidos</label>
            <input type="text" th:field="*{apellidos}"
                   class="form-control"
                   th:errorclass="needcorrection" />
            <div th:errors="*{apellidos}" class="error"></div>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" th:field="*{email}"
                   class="form-control"
                   th:errorclass="needcorrection" />
            <div th:errors="*{email}" class="error"></div>
        </div>

        <div class="mb-3">
            <label>Teléfono</label>
            <input type="text" th:field="*{telefono}"
                   class="form-control"
                   maxlength="9"
                   th:errorclass="needcorrection" />
            <div th:errors="*{telefono}" class="error"></div>
        </div>

        <div class="mb-3">
            <label>Disponibilidad</label>
            <input type="text" th:field="*{disponibilidad}"
                   class="form-control"
                   th:errorclass="needcorrection" />
        </div>

        <div class="form-check">
            <input type="checkbox" th:field="*{estadoAceptado}" />
            <label>Estado aceptado</label>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" th:field="*{activo}" />
            <label>Activo</label>
        </div>

        <button class="btn btn-primary">Guardar</button>
        <a th:href="@{/AsistentePersonal/list}"
           class="btn btn-secondary">Cancelar</a>

    </form>

</main>

</body>
</html>
