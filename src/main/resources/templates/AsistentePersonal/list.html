<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>SgOVI - Asistentes Aceptados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" th:href="@{/static/css/tecnico.css}">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script> 

    <style>
        .text-teal { color: #0d9488 !important; }
        .btn-teal { background-color: #0d9488 !important; color: white !important; }
        .btn-teal:hover { background-color: #0f766e !important; color: white !important; }
    </style>
</head>

<script>
$(document).ready(function () {
    $('#tablaAsistentes').DataTable({
        pageLength: 5,
        lengthMenu: [5, 10, 25, 50],
        dom:
            "<'row mb-3'<'col-md-6'f><'col-md-6 text-end'l>>" +
            "<'row'<'col-12'tr>>" +
            "<'row mt-3'<'col-md-5'i><'col-md-7'p>>",
        language: {
            search: "Buscar:",
            lengthMenu: "Mostrar _MENU_",
            info: "Mostrando _START_ a _END_ de _TOTAL_ asistentes",
            infoEmpty: "No hay datos",
            zeroRecords: "No se encontraron resultados",
            paginate: {
                first: "«",
                last: "»",
                next: "→",
                previous: "←"
            }
        }
    });
});
</script>

<body class="bg-light">

<!-- NAV -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-teal fw-bold" th:href="@{/TecnicoOVI/dashboard}">
            SgOVI - Gestión Técnica
        </a>

        <a th:href="@{/TecnicoOVI/logout}" class="btn btn-outline-danger btn-sm fw-bold">
            Cerrar Sesión
        </a>
    </div>
</nav>

<main class="container py-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="text-teal fw-bold mb-0">
            Asistentes PAP/PATI
        </h2>

        <!-- BOTÓN SOLICITUDES -->
        <a th:href="@{/AsistentePersonal/list/pendientes}" class="btn btn-warning fw-bold">
            Solicitudes
            <span class="badge bg-dark ms-2" th:text="${numSolicitudes}">0</span>
        </a>

        <a th:href="@{/TecnicoOVI/dashboard}" class="btn btn-teal">Volver</a>

    </div>

    <!-- TABLA -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">

            <div class="table-responsive">

                <table id="tablaAsistentes" class="table table-hover align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Zona</th>
                        <th>Disponibilidad</th>
                        <th>Puntuación</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- SOLO ACEPTADOS -->
                    <tr th:each="asistente : ${asistentes}">

                        <td class="fw-bold"
                            th:text="${asistente.nombre + ' ' + asistente.apellidos}">
                        </td>

                        <td th:text="${asistente.email}"></td>

                        <td th:text="${asistente.telefono}"></td>

                        <td th:text="${asistente.zona}"></td>

                        <td th:text="${asistente.disponibilidad}"></td>

                        <td th:text="${asistente.puntuacion}"></td>

                    </tr>

                    <!-- VACÍO -->
                    <tr th:if="${#lists.isEmpty(asistentes)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            No hay asistentes aceptados
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</main>

</body>
</html>
