<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Añadir Asistente Personal</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/asistentePersonal.css}">
</head>

<body>

<main class="container py-4">

    <h1 class="mb-4">Añadir Asistente Personal</h1>

    <form th:action="@{/AsistentePersonal/login}"
          th:object="${asistente}"
          method="post">

        <!-- NOMBRE -->
        <div class="mb-3 col-md-4">
            <label class="form-label">Nombre</label>
            <input type="text"
                   th:field="*{nombre}"
                   class="form-control"
                   th:errorclass="needcorrection" />
            <div th:if="${#fields.hasErrors('nombre')}"
                 th:errors="*{nombre}"
                 class="error"></div>
        </div>

        <!-- APELLIDOS -->
        <div class="mb-3 col-md-4">
            <label class="form-label">Apellidos</label>
            <input type="text"
                   th:field="*{apellidos}"
                   class="form-control"
                   th:errorclass="needcorrection" />
            <div th:if="${#fields.hasErrors('apellidos')}"
                 th:errors="*{apellidos}"
                 class="error"></div>
        </div>

        <!-- EMAIL -->
        <div class="mb-3 col-md-4">
            <label class="form-label">Email</label>
            <input type="email"
                   th:field="*{email}"
                   class="form-control"
                   th:errorclass="needcorrection" />
            <div th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"
                 class="error"></div>
        </div>

        <!-- CONTRASEÑA -->
        <div class="mb-3 col-md-4">
            <label class="form-label">Contraseña</label>
            <input type="contraseña"
                   th:field="*{contraseña}"
                   class="form-control"
                   th:errorclass="needcorrection" />
            <div th:if="${#fields.hasErrors('contraseña')}"
                 th:errors="*{contraseña}"
                 class="error"></div>
        </div>

        <!-- TELEFONO -->
        <div class="mb-3 col-md-4">
            <label class="form-label">Teléfono</label>
            <input type="text"
                   th:field="*{telefono}"
                   class="form-control"
                   maxlength="9"
                   th:errorclass="needcorrection" />
            <div th:if="${#fields.hasErrors('telefono')}"
                 th:errors="*{telefono}"
                 class="error"></div>
        </div>

        <!-- DISPONIBILIDAD -->
        <div class="mb-3 col-md-6">
            <label class="form-label">Disponibilidad</label>
            <input type="text"
                   th:field="*{disponibilidad}"
                   class="form-control"
                   th:errorclass="needcorrection" />
            <div th:if="${#fields.hasErrors('disponibilidad')}"
                 th:errors="*{disponibilidad}"
                 class="error"></div>
        </div>

        <!-- BOTONES -->
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/AsistentePersonal/list}"
           class="btn btn-secondary">Cancelar</a>

    </form>

</main>

</body>
</html>
