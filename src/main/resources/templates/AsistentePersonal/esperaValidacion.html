<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pendiente de Validación</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" type="text/css" th:href="@{/css/asistentePersonal.css}" />
</head>
<body>

<main class="container-custom">

    <div style="margin-bottom: 20px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="#0d9488" viewBox="0 0 16 16">
          <path d="M2.5 15a.5.5 0 1 1 0-1h1v-1a4.5 4.5 0 0 1 2.557-4.06c.29-.139.443-.377.443-.59v-.7c0-.213-.154-.451-.443-.59A4.5 4.5 0 0 1 3.5 3V2h-1a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1-1v1a4.5 4.5 0 0 1-2.557 4.06c-.29.139-.443.377-.443.59v.7c0 .213.154.451.443.59A4.5 4.5 0 0 1 12.5 14v1h1a.5.5 0 0 1 0 1h-11zm2-13v1c0 .537.12 1.045.337 1.5h6.326c.216-.455.337-.963.337-1.5V2h-7zm3 6.35c-1.127.327-2.072 1.109-2.52 2.15H11c-.448-1.041-1.393-1.823-2.5-2.15zM12.5 14v-1c0-.537-.12-1.045-.337-1.5H3.837c-.216.455-.337.963-.337 1.5v1h7z"/>
        </svg>
    </div>

    <h1>Cuenta en revisión</h1>

    <div class="card-espera">
        <h2 style="color: #333; margin-top: 0; margin-bottom: 20px; font-size: 1.5rem;">Solicitud recibida</h2>
        
        <p>
            Gracias por registrarte. Tu cuenta se encuentra actualmente 
            <span class="estado-false">en espera de ser validada</span> por un administrador.
        </p>
        
        <p style="color: #666; margin-bottom: 30px;">
            Recibirás acceso completo en cuanto revisemos tu perfil.
        </p>

        <button type="button" th:onclick="|window.location.href='@{/}'|">
            Volver al Inicio
        </button>
    </div>

</main>

</body>
</html>
