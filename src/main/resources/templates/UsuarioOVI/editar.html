<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>SgOVI - Editar Perfil</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          type="text/css"
          th:href="@{/css/usuarioOVI.css}" />
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">

        <div class="container">

            <a class="navbar-brand text-teal fw-bold"
               th:href="@{/UsuarioOVI/dashboard}">
                SgOVI - Usuario
            </a>

            <div class="d-flex align-items-center">

                <a th:href="@{/UsuarioOVI/logout}"
                   class="btn btn-outline-danger btn-sm fw-bold">
                    Cerrar Sesión
                </a>

            </div>

        </div>

    </nav>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="text-teal fw-bold">
                Editar Perfil
            </h2>

            <a th:href="@{/UsuarioOVI/perfil}"
               class="btn btn-teal">
                Volver
            </a>

        </div>

        <div class="card shadow-sm border-0 rounded-3">

            <div class="card-body p-4">

                <form th:action="@{/UsuarioOVI/editar}"
                      th:object="${usuario}"
                      method="post">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold text-teal">
                                Nombre
                            </label>

                            <input type="text"
                                   th:field="*{nombre}"
                                   class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold text-teal">
                                Apellidos
                            </label>

                            <input type="text"
                                   th:field="*{apellidos}"
                                   class="form-control">

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold text-teal">
                                Email
                            </label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold text-teal">
                                Teléfono
                            </label>

                            <input type="text"
                                   th:field="*{telefono}"
                                   class="form-control">

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-bold text-teal">
                            Dirección
                        </label>

                        <input type="text"
                               th:field="*{direccion}"
                               class="form-control">

                    </div>

                    <button type="submit"
                            class="btn btn-teal fw-bold">
                        Guardar Cambios
                    </button>

                </form>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
