<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/usuarioOVI.css}" />
    
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa; /* bg-light de bootstrap */
        }
        .form-signin {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            margin: auto;
        }
    </style>
</head>

<body>

    <main class="form-signin">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
            
            <div class="text-center mb-4">
                <h1 class="h3 mb-3 fw-bold text-teal">SgOVI</h1>
                <p class="text-muted">Inicia sesión en tu Área Personal</p>
            </div>

            <div th:if="${session.error != null}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2" viewBox="0 0 16 16">
                    <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                </svg>
                <div>
                    <span th:text="${session.error}">Credenciales incorrectas</span>
                </div>
            </div>

            <form th:action="@{/UsuarioOVI/login}" method="post" th:object="${user}">
                
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="usuario" th:field="*{usuario}" placeholder="nombre@ejemplo.com" required>
                    <label for="usuario" class="text-muted">Email</label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Contraseña" required>
                    <label for="password" class="text-muted">Contraseña</label>
                </div>

                <button class="w-100 btn btn-lg btn-teal fw-bold" type="submit">Entrar</button>
                
                <div class="text-center mt-4">
                    <p class="text-muted small mb-1">¿No tienes cuenta? <a th:href="@{/UsuarioOVI/register}" class="text-teal fw-bold text-decoration-none">Regístrate aquí</a></p>
                    <a th:href="@{/Inicio/logins}" class="text-muted small text-decoration-none">← Volver</a>
                </div>

            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
