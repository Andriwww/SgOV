<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Eliminar Usuario OVI</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/usuarioOVI.css"
        th:href="@{/css/usuarioOVI.css}" />
</head>

<body>
    <main class="container py-4">
        <h1 class="mb-4">Eliminar Usuario OVI</h1>

        <p>¿Estás seguro de que quieres eliminar al siguiente usuario?</p>

        <table class="table table-striped col-md-6 mt-3 mb-4">
            <tr>
                <th>ID</th>
                <td th:text="${usuario.idUsuario}"></td>
            </tr>
            <tr>
                <th>Nombre</th>
                <td th:text="${usuario.nombre}"></td>
            </tr>
            <tr>
                <th>Apellidos</th>
                <td th:text="${usuario.apellidos}"></td>
            </tr>
            <tr>
                <th>Email</th>
                <td th:text="${usuario.email}"></td>
            </tr>
        </table>

        <form th:action="@{/UsuarioOVI/delete/{id}(id=${usuario.idUsuario})}" method="post">
            <button type="submit" class="btn btn-danger">Eliminar</button>
            <a th:href="@{/UsuarioOVI/list}" class="btn btn-secondary">Cancelar</a>
        </form>

    </main>
</body>

</html>
