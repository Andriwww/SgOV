<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Usuarios OVI</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/usuarioOVI.css"
        th:href="@{/css/usuarioOVI.css}" />
</head>

<body>
    <main class="container py-4">
        <h1 class="mb-4">Usuarios OVI</h1>

        <div th:if="${#lists.isEmpty(usuarios)}">
            No hay usuarios en la base de datos.
        </div>

        <table th:unless="${#lists.isEmpty(usuarios)}" class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Dirección</th>
                    <th>RGBD</th>
                    <th>Aceptado</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.idUsuario}"></td>
                    <td th:text="${usuario.nombre}"></td>
                    <td th:text="${usuario.apellidos}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td th:text="${usuario.telefono}"></td>
                    <td th:text="${usuario.direccion}"></td>
                    <td th:text="${usuario.consentimientoRGBD ? 'Sí' : 'No'}"></td>
                    <td th:text="${usuario.estadoAceptado ? 'Sí' : 'No'}"></td>
                    <td>
                        <a th:href="@{/UsuarioOVI/edit/{id}(id=${usuario.idUsuario})}"
                            class="btn btn-sm btn-outline-warning">Editar</a>
                        <a th:href="@{/UsuarioOVI/confirm-delete/{id}(id=${usuario.idUsuario})}"
                            class="btn btn-sm btn-outline-danger">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/UsuarioOVI/add}" class="btn btn-primary mt-3">+ Añadir</a>

    </main>
</body>

</html>
