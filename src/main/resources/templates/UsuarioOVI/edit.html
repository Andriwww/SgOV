<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Usuario OVI</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/usuarioOVI.css"
        th:href="@{/css/usuarioOVI.css}" />
</head>

<body>
    <main class="container py-4">
        <h1 class="mb-4">Editar Usuario OVI</h1>

        <form th:action="@{/UsuarioOVI/edit}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{idUsuario}" />

            <div class="mb-3 col-md-4">
                <label class="form-label">ID Usuario</label>
                <input type="text" th:field="*{idUsuario}" class="form-control" readonly="readonly" />
            </div>

            <div class="mb-3 col-md-4">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" th:field="*{email}" class="form-control"
                    th:errorclass="needcorrection" />
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
            </div>

            <div class="mb-3 col-md-4">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" class="form-control"
                    th:errorclass="needcorrection" />
                <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error"></div>
            </div>

            <div class="mb-3 col-md-4">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input id="apellidos" type="text" th:field="*{apellidos}" class="form-control"
                    th:errorclass="needcorrection" />
                <div th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="error"></div>
            </div>

            <div class="mb-3 col-md-4">
                <label for="telefono" class="form-label">Teléfono</label>
                <input id="telefono" type="text" th:field="*{telefono}" class="form-control"
                    th:errorclass="needcorrection" maxlength="9" />
                <div th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" class="error"></div>
            </div>

            <div class="mb-3 col-md-4">
                <label for="direccion" class="form-label">Dirección</label>
                <input id="direccion" type="text" th:field="*{direccion}" class="form-control" />
            </div>

            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{consentimientoRGBD}" />
                    <label class="form-check-label">Consentimiento RGBD</label>
                </div>
            </div>

            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" th:field="*{estadoAceptado}" />
                    <label class="form-check-label">Estado Aceptado</label>
                </div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/UsuarioOVI/list}" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>
    </main>
</body>

</html>
