<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Comunicaciones OVI-PAP</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/comunicacionUsuarioOVIPAP.css"
        th:href="@{/css/comunicacionUsuarioOVIPAP.css}" />
</head>

<body>
    <main class="container py-4">
        <h1 class="mb-4">Comunicaciones OVI-PAP</h1>

        <div th:if="${#lists.isEmpty(comunicaciones)}">
            No hay comunicaciones en la base de datos.
        </div>

        <table th:unless="${#lists.isEmpty(comunicaciones)}" class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Emisor</th>
                    <th>Receptor</th>
                    <th>Mensaje</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="comunicacion : ${comunicaciones}">
                    <td th:text="${comunicacion.idComunicacion}"></td>
                    <td th:text="${#temporals.format(comunicacion.fecha, 'dd/MM/yyyy')}"></td>
                    <td th:text="${comunicacion.emisor}"></td>
                    <td th:text="${comunicacion.receptor}"></td>
                    <td th:text="${comunicacion.mensaje}"></td>
                    <td>
                        <a th:href="@{/ComunicacionUsuarioOVIPAP/edit/{id}(id=${comunicacion.idComunicacion})}"
                            class="btn btn-sm btn-outline-warning">Editar</a>
                        <a th:href="@{/ComunicacionUsuarioOVIPAP/confirm-delete/{id}(id=${comunicacion.idComunicacion})}"
                            class="btn btn-sm btn-outline-danger">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/ComunicacionUsuarioOVIPAP/add}" class="btn btn-primary mt-3">+ Añadir</a>

    </main>
</body>

</html>
