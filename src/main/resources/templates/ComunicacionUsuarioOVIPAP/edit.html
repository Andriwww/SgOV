<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Comunicación</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/comunicacionUsuarioOVIPAP.css"
        th:href="@{/css/comunicacionUsuarioOVIPAP.css}" />
</head>

<body>
    <main class="container py-4">
        <h1 class="mb-4">Editar Comunicación OVI-PAP</h1>

        <form th:action="@{/ComunicacionUsuarioOVIPAP/edit}" th:object="${comunicacion}" method="post">
            <input type="hidden" th:field="*{idComunicacion}" />

            <div class="mb-3 col-md-4">
                <label class="form-label">ID Comunicación</label>
                <input type="text" th:field="*{idComunicacion}" class="form-control" readonly="readonly" />
            </div>

            <div class="mb-3 col-md-4">
                <label for="fecha" class="form-label">Fecha</label>
                <input id="fecha" type="date" th:field="*{fecha}" class="form-control"
                    th:errorclass="needcorrection" />
                <div th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}" class="error"></div>
            </div>

            <div class="mb-3 col-md-4">
                <label for="emisor" class="form-label">Emisor</label>
                <input id="emisor" type="text" th:field="*{emisor}" class="form-control"
                    th:errorclass="needcorrection" />
                <div th:if="${#fields.hasErrors('emisor')}" th:errors="*{emisor}" class="error"></div>
            </div>

            <div class="mb-3 col-md-4">
                <label for="receptor" class="form-label">Receptor</label>
                <input id="receptor" type="text" th:field="*{receptor}" class="form-control"
                    th:errorclass="needcorrection" />
                <div th:if="${#fields.hasErrors('receptor')}" th:errors="*{receptor}" class="error"></div>
            </div>

            <div class="mb-3 col-md-6">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea id="mensaje" th:field="*{mensaje}" class="form-control" rows="3"
                    th:errorclass="needcorrection"></textarea>
                <div th:if="${#fields.hasErrors('mensaje')}" th:errors="*{mensaje}" class="error"></div>
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/ComunicacionUsuarioOVIPAP/list}" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>
    </main>
</body>

</html>
