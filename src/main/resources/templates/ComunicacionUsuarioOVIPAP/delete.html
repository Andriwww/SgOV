<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Eliminar Comunicación</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/comunicacionUsuarioOVIPAP.css"
        th:href="@{/css/comunicacionUsuarioOVIPAP.css}" />
</head>

<body>
    <main class="container py-4">
        <h1 class="mb-4">Eliminar Comunicación OVI-PAP</h1>

        <p>¿Estás seguro de que quieres eliminar la siguiente comunicación?</p>

        <table class="table table-striped col-md-6 mt-3 mb-4">
            <tr>
                <th>ID</th>
                <td th:text="${comunicacion.idComunicacion}"></td>
            </tr>
            <tr>
                <th>Fecha</th>
                <td th:text="${#temporals.format(comunicacion.fecha, 'dd/MM/yyyy')}"></td>
            </tr>
            <tr>
                <th>Emisor</th>
                <td th:text="${comunicacion.emisor}"></td>
            </tr>
            <tr>
                <th>Receptor</th>
                <td th:text="${comunicacion.receptor}"></td>
            </tr>
            <tr>
                <th>Mensaje</th>
                <td th:text="${comunicacion.mensaje}"></td>
            </tr>
        </table>

        <form th:action="@{/ComunicacionUsuarioOVIPAP/delete/{id}(id=${comunicacion.idComunicacion})}" method="post">
            <button type="submit" class="btn btn-danger">Eliminar</button>
            <a th:href="@{/ComunicacionUsuarioOVIPAP/list}" class="btn btn-secondary">Cancelar</a>
        </form>

    </main>
</body>

</html>
