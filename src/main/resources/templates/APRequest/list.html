<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Mis Peticiones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/usuarioOVI.css}" />
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-teal fw-bold" th:href="@{/UsuarioOVI/dashboard}">SgOVI</a>
            <a th:href="@{/UsuarioOVI/dashboard}" class="btn btn-outline-secondary btn-sm">Volver al Panel</a>
        </div>
    </nav>

    <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-teal fw-bold">Mis Peticiones de Asistencia</h2>
            <a th:href="@{/APRequest/add}" class="btn btn-teal">+ Nueva Petición</a>
        </div>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Fecha Solicitada</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Candidatos Propuestos</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="request : ${requests}">
                            <td class="ps-4 fw-bold" th:text="${#temporals.format(request.fechaSolicitud, 'dd/MM/yyyy')}">01/01/2024</td>
                            <td>
                                <small class="text-muted" th:text="${#strings.abbreviate(request.descripcion, 50)}">Descripción corta...</small>
                            </td>
                            <td>
                                <span th:class="'badge rounded-pill ' + 
                                    (${request.estado.name() == 'Pendiente'} ? 'bg-warning text-dark' : 
                                    (${request.estado.name() == 'Aprobada'} ? 'bg-success' : 
                                    (${request.estado.name() == 'Rechazada'} ? 'bg-danger' : 'bg-info text-dark')))"
                                      th:text="${request.estado}">
                                    Pendiente
                                </span>
                            </td>
                            <td>
                                <div th:if="${request.candidatos == null or request.candidatos.empty}">
                                    <span class="text-muted italic small">Buscando profesionales...</span>
                                </div>
                                <div th:else>
                                    <span class="badge bg-light text-dark border" th:each="c : ${request.candidatos}" th:text="${c.nombre}">
                                        Nombre Candidato
                                    </span>
                                </div>
                            </td>
                            <td class="text-center pe-4">
                                <a th:href="@{/APRequest/delete/{id}(id=${request.idRequest})}" 
                                   class="btn btn-outline-danger btn-sm"
                                   onclick="return confirm('¿Estás seguro de que deseas cancelar esta petición?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${requests.empty}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                No has realizado ninguna petición todavía.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
