<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nueva AP Request</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/apRequest.css}">
</head>

<body>

<main class="container py-4">

    <h1 class="mb-4">Nueva Solicitud</h1>

    <form th:action="@{/APRequest/add}" th:object="${request}" method="post">

        <div class="mb-3 col-md-4">
            <label class="form-label">ID Usuario</label>
            <input type="number"
                   th:field="*{idUsuario}"
                   class="form-control"
                   th:errorclass="needcorrection">
            <div class="error" th:errors="*{idUsuario}"></div>
        </div>

        <div class="mb-3 col-md-4">
            <label class="form-label">Fecha solicitud</label>
            <input type="date"
                   th:field="*{fechaSolicitud}"
                   class="form-control"
                   th:errorclass="needcorrection">
            <div class="error" th:errors="*{fechaSolicitud}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{descripcion}"
                      class="form-control"
                      th:errorclass="needcorrection"></textarea>
            <div class="error" th:errors="*{descripcion}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/APRequest/list}" class="btn btn-secondary">Cancelar</a>

    </form>

</main>

</body>
</html>
