<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Nueva Petición de Asistencia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/usuarioOVI.css}" />
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-5">
    <div class="container">
        <a class="navbar-brand text-teal fw-bold" th:href="@{/UsuarioOVI/dashboard}">
            SgOVI - Área Personal
        </a>
        <div class="d-flex align-items-center">
            <a th:href="@{/UsuarioOVI/logout}" class="btn btn-outline-danger btn-sm fw-bold">Cerrar Sesión</a>
        </div>
    </div>
</nav>

<main class="container mb-5">

    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold text-teal mb-3">Realizar Petición</h1>
        <p class="lead text-muted">
            Indica tu zona, disponibilidad y preferencias
        </p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">

                <form th:action="@{/APRequest/add}" th:object="${apRequest}" method="post">

                    <input type="hidden" th:field="*{idRequest}" />
                    <input type="hidden" th:field="*{idUsuario}" />

                    <!-- SOLO DESCRIPCIÓN -->
                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Información de la solicitud
                        </label>

                        <textarea th:field="*{descripcion}"
                                  class="form-control form-control-lg"
                                  rows="7"
                                  placeholder="Escribe aquí:

Zona: Castellón
Disponibilidad: mañanas / tardes / fines de semana
Preferencias: acompañamiento médico, estudios, etc.">
                        </textarea>

                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/UsuarioOVI/dashboard}" class="btn btn-light border">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-teal fw-bold">
                            Enviar petición
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</main>

</body>
</html>
