<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>SgOVI - Asistentes Aceptados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/database.css}">

    <style>
        .text-teal { color: #0d9488 !important; }
        .btn-teal { background-color: #0d9488 !important; color: white !important; }
        .btn-teal:hover { background-color: #0f766e !important; color: white !important; }
    </style>
</head>

<body class="bg-light">

<!-- NAV -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-teal fw-bold" th:href="@{/TecnicoOVI/dashboard}">
            SgOVI - Gestión Técnica
        </a>

        <a th:href="@{/TecnicoOVI/logout}" class="btn btn-outline-danger btn-sm fw-bold">
            Cerrar Sesión
        </a>
    </div>
</nav>

<main class="container py-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="text-teal fw-bold mb-0">
            Asistentes PAP/PATI
        </h2>

        <a th:href="@{/APRequest/list}" class="btn btn-teal">Volver</a>

        <a th:href="@{/APRequest/candidatos/{idSolicitud}(idSolicitud=${request.idRequest})}"
            class="btn btn-primary">
            Ver lista candidatos
        </a>

    </div>

    <!-- TABLA -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0 database">

                    <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Zona</th>
                        <th>Disponibilidad</th>
                        <th>Puntuación</th>
                        <th>Candidato</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- SOLO ACEPTADOS -->
                    <tr th:each="asistente : ${asistentes}">

                        <td class="fw-bold"
                            th:text="${asistente.nombre + ' ' + asistente.apellidos}">
                        </td>

                        <td th:text="${asistente.email}"></td>

                        <td th:text="${asistente.telefono}"></td>

                        <td th:text="${asistente.zona}"></td>

                        <td th:text="${asistente.disponibilidad}"></td>

                        <td th:text="${asistente.puntuacion}"></td>

                        <th:block th:with="ids=${candidatos.![idAsistente]}">

                            <td>

                                <!-- YA AÑADIDO -->
                                <span th:if="${ids.contains(asistente.idAsistente)}"
                                    class="badge bg-secondary">
                                    Ya añadido
                                </span>

                                <!-- BOTÓN AÑADIR -->
                                <a th:if="${!ids.contains(asistente.idAsistente)}"
                                th:href="@{/APRequest/candidatos/add/{idSolicitud}/{idAsistente}(
                                        idSolicitud=${request.idRequest},
                                        idAsistente=${asistente.idAsistente}
                                )}"
                                class="btn btn-success btn-sm">
                                    Añadir candidato
                                </a>

                            </td>

                            </th:block>

                    </tr>

                    <!-- VACÍO -->
                    <tr th:if="${#lists.isEmpty(asistentes)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            No hay asistentes 
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</main>

    <th:block th:replace="fragments/datatable :: scripts"></th:block>
</body>
</html>
