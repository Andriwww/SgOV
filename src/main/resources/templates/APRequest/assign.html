<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SgOVI - Asignar Asistentes</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/usuarioOVI.css}" />

    <style>
        .candidate-card {
            transition: all 0.2s ease;
        }

        .candidate-card:hover {
            transform: translateY(-2px);
        }

        .score-badge {
            font-size: 1rem;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-teal fw-bold"
           th:href="@{/TecnicoOVI/dashboard}">
            SgOVI - Gestión Técnica
        </a>

        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/APRequest/list}"
               class="btn btn-outline-secondary btn-sm fw-bold">
                Volver
            </a>
        </div>
    </div>
</nav>

<main class="container mb-5">

    <div class="mb-4">
        <h1 class="fw-bold text-teal mb-2">
            Propuesta de asistentes personales
        </h1>

        <p class="text-muted mb-0">
            Selecciona los candidatos más adecuados para esta solicitud.
        </p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-4">

            <div class="row g-4">

                <div class="col-md-3">
                    <h6 class="text-muted mb-1">Solicitud</h6>
                    <p class="fw-bold mb-0"
                       th:text="${request.idRequest}">
                    </p>
                </div>

                <div class="col-md-3">
                    <h6 class="text-muted mb-1">Usuario</h6>
                    <p class="fw-bold mb-0"
                       th:text="${request.idUsuario}">
                    </p>
                </div>

                <div class="col-md-3">
                    <h6 class="text-muted mb-1">Estado</h6>

                    <span class="badge rounded-pill bg-success">
                        Solicitud aprobada
                    </span>
                </div>

                <div class="col-md-3">
                    <h6 class="text-muted mb-1">Fecha</h6>

                    <p class="fw-bold mb-0"
                       th:text="${request.fechaSolicitud}">
                    </p>
                </div>

            </div>

            <hr>

            <div>
                <h6 class="text-muted mb-2">
                    Descripción de necesidades
                </h6>

                <p class="mb-0"
                   th:text="${request.descripcion}">
                </p>
            </div>

        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold text-teal mb-0">
            Candidatos compatibles
        </h3>

        <span class="badge bg-primary rounded-pill px-3 py-2"
              th:text="${#lists.size(candidatos)} + ' candidatos encontrados'">
        </span>
    </div>

    <div class="row g-4">

        <div class="col-lg-6"
             th:each="ap : ${candidatos}">

            <div class="card candidate-card border-0 shadow-sm rounded-4 h-100">

                <div class="card-body p-4 d-flex flex-column">

                    <div class="d-flex justify-content-between align-items-start mb-3">

                        <div>
                            <h4 class="fw-bold text-teal mb-1"
                                th:text="${ap.nombre}">
                            </h4>

                            <p class="text-muted mb-0">
                                Asistente Personal
                            </p>
                        </div>

                        <span class="badge bg-success score-badge rounded-pill px-3 py-2"
                              th:text="${ap.puntuacion + '%'}">
                        </span>
                    </div>

                    <div class="row g-3 mb-4">

                        <div class="col-6">
                            <div class="bg-light rounded-3 p-3 h-100">

                                <small class="text-muted d-block mb-1">
                                    Disponibilidad
                                </small>

                                <span class="fw-bold"
                                      th:text="${ap.disponibilidad}">
                                </span>

                            </div>
                        </div>

                        <div class="col-6">
                            <div class="bg-light rounded-3 p-3 h-100">

                                <small class="text-muted d-block mb-1">
                                    Zona
                                </small>

                                <span class="fw-bold"
                                      th:text="${ap.zona}">
                                </span>

                            </div>
                        </div>

                        <div class="col-12">
                            <div class="bg-light rounded-3 p-3">

                                <small class="text-muted d-block mb-1">
                                    Preferencias compatibles
                                </small>

                                <span th:text="${ap.preferencias}">
                                </span>

                            </div>
                        </div>

                    </div>

                    <div class="mt-auto">

                        <form method="post"
                              th:action="@{/APRequest/select/{requestId}(requestId=${request.idRequest})}">

                            <input type="hidden"
                                   name="idAsistente"
                                   th:value="${ap.idAsistente}">

                            <button type="submit"
                                    class="btn btn-teal w-100 fw-bold">
                                Seleccionar candidato
                            </button>

                        </form>

                    </div>

                </div>
            </div>
        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
